<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1b2433"/>
    </linearGradient>
    <linearGradient id="hp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#2ea043"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <g opacity="0.08" stroke="#ffffff">
    <path d="M0 80H1280M0 160H1280M0 240H1280M160 0V320M320 0V320M480 0V320M640 0V320M800 0V320M960 0V320M1120 0V320"/>
  </g>
  <!-- health bar losing a chunk -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="840" y="118" font-size="16" fill="#8b98a9">CurrentHealth</text>
    <rect x="840" y="130" width="360" height="30" rx="6" fill="#30363d"/>
    <rect x="840" y="130" width="214" height="30" rx="6" fill="url(#hp)"/>
    <rect x="1054" y="130" width="62" height="30" fill="#ff4d4d" opacity="0.85"/>
    <text x="1085" y="104" text-anchor="middle" font-size="22" font-weight="700" fill="#ff6b6b">−25</text>
    <g font-size="14" font-weight="600">
      <rect x="840" y="190" width="136" height="30" rx="15" fill="none" stroke="#ff6b6b"/>
      <text x="908" y="210" text-anchor="middle" fill="#ff6b6b">OnDamageTaken</text>
      <rect x="984" y="190" width="132" height="30" rx="15" fill="none" stroke="#ffb84d"/>
      <text x="1050" y="210" text-anchor="middle" fill="#ffb84d">OnHealReceived</text>
      <rect x="1124" y="190" width="76" height="30" rx="15" fill="none" stroke="#c9d1d9"/>
      <text x="1162" y="210" text-anchor="middle" fill="#c9d1d9">OnDeath</text>
    </g>
  </g>
  <text x="72" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">Health &amp; Damage System</text>
  <text x="72" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#c9d1d9">Reusable health and damage for Unreal Engine 5</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#0d1117" font-weight="600">
    <rect x="72" y="214" width="150" height="36" rx="18" fill="#ffffff"/>
    <text x="147" y="238" text-anchor="middle">Unreal 5.8</text>
    <rect x="236" y="214" width="130" height="36" rx="18" fill="#ffb84d"/>
    <text x="301" y="238" text-anchor="middle">C++ core</text>
    <rect x="380" y="214" width="190" height="36" rx="18" fill="#4da3ff"/>
    <text x="475" y="238" text-anchor="middle">Blueprint hooks</text>
  </g>
</svg>
